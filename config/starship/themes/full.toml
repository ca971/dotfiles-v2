# ═══════════════════════════════════════════════════════════════════════════════
# @file config/starship/themes/full.toml
# @description Full theme — all segments, Nerd Fonts icons, Catppuccin colors
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_metrics\
$fill\
$python\
$nodejs\
$rust\
$golang\
$ruby\
$lua\
$docker_context\
$kubernetes\
$terraform\
$nix_shell\
$package\
$cmd_duration\
$line_break\
$character"""

right_format = """
$status\
$jobs\
$time"""

add_newline = true

# ───────────────────────────────────────────────────────────────────────────────
# Palette (Catppuccin Mocha)
# ───────────────────────────────────────────────────────────────────────────────
palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# ───────────────────────────────────────────────────────────────────────────────
# OS icon
# ───────────────────────────────────────────────────────────────────────────────
[os]
disabled = false
style = "bold text"

[os.symbols]
Macos = " "
Linux = " "
Windows = " "
Arch = " "
Debian = " "
Fedora = " "
Ubuntu = " "
NixOS = " "
FreeBSD = " "

# ───────────────────────────────────────────────────────────────────────────────
# Core modules
# ───────────────────────────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"

[directory]
truncation_length = 5
truncation_symbol = "…/"
style = "bold sapphire"
read_only = " 󰌾"
home_symbol = "󰋜 "

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold red"

[git_metrics]
disabled = false
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
added_style = "bold green"
deleted_style = "bold red"

[fill]
symbol = " "

# ───────────────────────────────────────────────────────────────────────────────
# Language modules
# ───────────────────────────────────────────────────────────────────────────────
[python]
symbol = " "
format = '[$symbol$version(\($virtualenv\))]($style) '
style = "bold yellow"

[nodejs]
symbol = "󰎙 "
format = "[$symbol$version]($style) "
style = "bold green"

[rust]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold peach"

[golang]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold sky"

[ruby]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold red"

[lua]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold blue"

# ───────────────────────────────────────────────────────────────────────────────
# Infrastructure
# ───────────────────────────────────────────────────────────────────────────────
[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style = "bold blue"

[kubernetes]
disabled = false
symbol = "󱃾 "
format = "[$symbol$context(/$namespace)]($style) "
style = "bold lavender"

[terraform]
symbol = "󱁢 "
format = "[$symbol$workspace]($style) "
style = "bold mauve"

[nix_shell]
symbol = " "
format = "[$symbol$state]($style) "
style = "bold blue"

[package]
symbol = "󰏖 "
format = "[$symbol$version]($style) "
style = "bold peach"

# ───────────────────────────────────────────────────────────────────────────────
# Right side
# ───────────────────────────────────────────────────────────────────────────────
[cmd_duration]
min_time = 1000
format = "[󰔛 $duration]($style) "
style = "bold yellow"

[time]
disabled = false
format = "[$time]($style)"
style = "overlay1"
time_format = "%H:%M"

[status]
disabled = false
format = "[$status]($style) "
style = "bold red"

[jobs]
threshold = 1
symbol = "✦ "
style = "bold blue"
