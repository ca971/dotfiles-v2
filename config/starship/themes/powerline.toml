# ═══════════════════════════════════════════════════════════════════════════════
# @file config/starship/themes/powerline.toml
# @description Powerline theme — colored segments with arrow separators
# @since 1.0.0
# @version 1.0.0
#
# Requires: Nerd Font with Powerline symbols
# ═══════════════════════════════════════════════════════════════════════════════

format = """
[](blue)\
$os\
$username\
[](bg:sapphire fg:blue)\
$directory\
[](bg:mauve fg:sapphire)\
$git_branch\
$git_status\
[](bg:peach fg:mauve)\
$python\
$nodejs\
$rust\
$golang\
[](bg:yellow fg:peach)\
$docker_context\
$kubernetes\
[](bg:surface0 fg:yellow)\
$cmd_duration\
[](fg:surface0)\
$line_break\
$character"""

right_format = """
[](fg:surface0)\
[](bg:surface0 fg:overlay1)\
$time\
[](bg:overlay1 fg:blue)\
$status\
[](fg:overlay1)"""

add_newline = true

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# ───────────────────────────────────────────────────────────────────────────────
# Segments
# ───────────────────────────────────────────────────────────────────────────────
[os]
disabled = false
style = "bg:blue fg:base"
format = "[ $symbol]($style)"

[os.symbols]
Macos = ""
Linux = ""
Windows = ""
Arch = ""
Debian = ""
Fedora = ""

[username]
show_always = true
style_user = "bg:blue fg:base"
style_root = "bg:red fg:base"
format = "[ $user ]($style)"

[directory]
style = "bg:sapphire fg:base"
format = "[ 󰉋 $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:mauve fg:base"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:mauve fg:base"
format = "[$all_status$ahead_behind]($style)"

[python]
symbol = ""
style = "bg:peach fg:base"
format = "[ $symbol $version ]($style)"

[nodejs]
symbol = "󰎙"
style = "bg:peach fg:base"
format = "[ $symbol $version ]($style)"

[rust]
symbol = ""
style = "bg:peach fg:base"
format = "[ $symbol $version ]($style)"

[golang]
symbol = ""
style = "bg:peach fg:base"
format = "[ $symbol $version ]($style)"

[docker_context]
symbol = ""
style = "bg:yellow fg:base"
format = "[ $symbol $context ]($style)"

[kubernetes]
disabled = false
symbol = "󱃾"
style = "bg:yellow fg:base"
format = "[ $symbol $context ]($style)"

[cmd_duration]
min_time = 1000
style = "bg:surface0 fg:text"
format = "[ 󰔛 $duration ]($style)"

[time]
disabled = false
style = "bg:surface0 fg:subtext1"
format = "[ $time ]($style)"
time_format = "%H:%M"

[status]
disabled = false
style = "bg:overlay1 fg:base"
format = "[ $status ]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"
