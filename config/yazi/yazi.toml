# ═══════════════════════════════════════════════════════════════════════════════
# @file config/yazi/yazi.toml
# @description Yazi — blazing-fast terminal file manager
# @since 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[manager]
# Show hidden files by default
show_hidden = true

# Sort: alphabetical, natural, modified, created, extension, size
sort_by = "natural"
sort_dir_first = true
sort_reverse = false
sort_sensitive = false

# Layout ratio: [parent, current, preview]
ratio = [1, 3, 4]

[preview]
# Image preview protocol
image_filter = 2   # Kitty graphics protocol
image_quality = 90
max_width = 960
max_height = 540

# Code preview
tab_size = 2
syntax_theme = "catppuccin-mocha"

[opener]
# Use $EDITOR for text files
edit = [{ run = "$EDITOR \"$@\"", block = true, for = "unix" }]

# Use system open for everything else
open = [
  { run = "open \"$@\"", for = "macos" },
  { run = "xdg-open \"$@\"", for = "linux" },
]

[tasks]
# Fuzzy find with fzf
task_fzf = "fzf"

[open]
# Rules for opening files based on mime type
rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/xml", use = "edit" },
  { mime = "application/x-yaml", use = "edit" },
  { mime = "application/x-toml", use = "edit" },
  { mime = "image/*", use = "open" },
  { mime = "video/*", use = "open" },
  { mime = "audio/*", use = "open" },
  { mime = "application/pdf", use = "open" },
]
