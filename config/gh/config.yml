# GitHub CLI configuration
# https://cli.github.com/manual/

version: "1"
editor: nvim
prompt: enabled
prefer_editor_prompt: disabled

# Aliases
aliases:
  co: pr checkout
  pv: pr view
  rv: repo view
  prc: pr create --fill
  prm: pr merge --squash
  issues: issue list --assignee @me
  reviews: pr list --search "review-requested:@me"

# Pager for long output
pager: less -R

# Browser
browser: open
