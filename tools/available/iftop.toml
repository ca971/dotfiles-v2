[meta]
name = "iftop"
description = "Display bandwidth usage on a network interface"
homepage = "https://www.ex-parrot.com/pdw/iftop"
category = "net"
version = "latest"
verify = "iftop -h 2>&1 | head -1"


[[install]]
method = "system"
platforms = ["linux.debian"]
package = "iftop"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "iftop"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "iftop"


[[install]]
method = "system"
platforms = ["bsd"]
package = "iftop"
[[install]]
method = "brew"
platforms = ["darwin"]
package = "iftop"

[config]
symlinks = []
dependencies = []
