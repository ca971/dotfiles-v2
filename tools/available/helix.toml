[meta]
name = "helix"
description = "Modern modal text editor with built-in LSP, tree-sitter, and multiple selections"
homepage = "https://helix-editor.com"
category = "editor"
version = "latest"
verify = "hx --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "helix"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "helix"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "helix"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "helix-term"

[config]
symlinks = []
dependencies = []
