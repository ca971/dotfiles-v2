[meta]
name = "taplo"
description = "TOML toolkit with LSP, formatter, and validator"
homepage = "https://taplo.tamasfe.dev"
category = "dev"
version = "latest"
verify = "taplo --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "taplo"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "taplo-cli"

[config]
symlinks = []
dependencies = []
