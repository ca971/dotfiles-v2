[meta]
name = "rust"
description = "Systems programming language"
homepage = "https://www.rust-lang.org"
category = "lang"
version = "latest"
verify = "rustc --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "rust"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "rust"

[config]
symlinks = []
dependencies = []
