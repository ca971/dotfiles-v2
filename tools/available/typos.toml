# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/typos.toml
# @description Tool descriptor for typos (Source code spell checker for identifiers)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "typos"
description = "Source code spell checker for identifiers"
homepage = "https://github.com/crate-ci/typos"
category = "dev"
version = "latest"
verify = "typos --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "typos"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "typos-cli"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "typos-cli"

[config]
symlinks = []
dependencies = []
