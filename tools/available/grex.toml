# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/grex.toml
# @description Tool descriptor for grex (Generate regular expressions from examples)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "grex"
description = "Generate regular expressions from examples"
homepage = "https://github.com/pemistahl/grex"
category = "dev"
version = "latest"
verify = "grex --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "grex"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "grex"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "grex"

[config]
symlinks = []
dependencies = []
