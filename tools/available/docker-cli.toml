# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/docker-cli.toml
# @description Tool descriptor for docker-cli (Docker command-line interface)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "docker-cli"
description = "Docker command-line interface"
homepage = "https://github.com/docker/cli"
category = "containers"
version = "latest"
verify = "docker --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "docker-cli"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "docker"

[[install]]
method = "system"
platforms = ["linux.debian"]
package = "docker.io"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "docker"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "docker"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "docker-cli"

[config]
symlinks = []
dependencies = []
