[meta]
name = "gitleaks"
description = "Detect secrets and API keys in git repositories — pre-commit hook and CI integration"
homepage = "https://gitleaks.io"
category = "security"
version = "latest"
verify = "gitleaks version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "gitleaks"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "gitleaks"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "gitleaks"

[config]
symlinks = []
dependencies = []
