[meta]
name = "pre-commit"
description = "Framework for managing git pre-commit hooks"
homepage = "https://pre-commit.com"
category = "dev"
version = "latest"
verify = "pre-commit --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "pre-commit"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "pre-commit"

[config]
symlinks = []
dependencies = []
