[meta]
name = "stern"
description = "Multi pod and container log tailing for Kubernetes"
homepage = "https://github.com/stern/stern"
category = "cloud"
version = "latest"
verify = "stern --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "stern"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "stern"

[config]
symlinks = []
dependencies = []
