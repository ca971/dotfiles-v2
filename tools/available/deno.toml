[meta]
name = "deno"
description = "Secure JavaScript and TypeScript runtime"
homepage = "https://deno.land"
category = "dev"
version = "latest"
verify = "deno --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "deno"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "deno"

[config]
symlinks = []
dependencies = []
