[meta]
name = "csvlens"
description = "CSV file viewer for the command line"
homepage = "https://github.com/YS-L/csvlens"
category = "data"
version = "latest"
verify = "csvlens --version"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "csvlens"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "csvlens"

[config]
symlinks = []
dependencies = []
