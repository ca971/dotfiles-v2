# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/gitui.toml
# @description Tool descriptor for gitui (Blazing fast terminal UI for git)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "gitui"
description = "Blazing fast terminal UI for git"
homepage = "https://github.com/extrawurst/gitui"
category = "dev"
version = "latest"
verify = "gitui --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "gitui"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "gitui"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "gitui"

[config]
symlinks = []
dependencies = []
