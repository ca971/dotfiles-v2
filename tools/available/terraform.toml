[meta]
name = "terraform"
description = "Infrastructure as code tool"
homepage = "https://www.terraform.io"
category = "cloud"
version = "latest"
verify = "terraform version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "terraform"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "terraform"

[config]
symlinks = []
dependencies = []
