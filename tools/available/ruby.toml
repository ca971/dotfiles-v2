[meta]
name = "ruby"
description = "Dynamic programming language for productivity"
homepage = "https://www.ruby-lang.org"
category = "lang"
version = "latest"
verify = "ruby --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "ruby"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "ruby"

[[install]]
method = "system"
platforms = ["linux.debian"]
package = "ruby"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "ruby"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "ruby"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "ruby"

[config]
symlinks = []
dependencies = []
