# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/ruby.toml
# @description Tool descriptor for ruby (dynamic, open source programming language)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "ruby"
description = "Dynamic, open source programming language with a focus on simplicity"
homepage = "https://www.ruby-lang.org"
category = "lang"
version = "latest"
verify = "ruby --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "ruby"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "ruby"

[[install]]
method = "system"
platforms = ["linux.debian"]
package = "ruby"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "ruby"

[config]
symlinks = [
  { src = "config/ruby/gemrc", dst = "~/.gemrc" },
  { src = "config/ruby/default-gems", dst = "~/.default-gems" },
  { src = "config/ruby/bundle", dst = "~/.bundle" },
]
dependencies = []
