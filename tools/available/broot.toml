# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/broot.toml
# @description Tool descriptor for broot (New way to see and navigate directory trees)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "broot"
description = "New way to see and navigate directory trees"
homepage = "https://github.com/Canop/broot"
category = "core"
version = "latest"
verify = "broot --version"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "broot"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "broot"

[config]
symlinks = [{ src = "config/broot", dst = "~/.config/broot" }]
dependencies = []
