# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/ghostty.toml
# @description Tool descriptor for Ghostty (GPU-accelerated terminal emulator)
# @since 1.0.0
# @version 1.1.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "ghostty"
description = "GPU-accelerated terminal emulator — native, fast, feature-rich"
homepage = "https://ghostty.org"
category = "terminal"
version = "latest"
verify = "ghostty --version"

# ── Binary install methods ──

[[install]]
method = "mise"
platforms = ["darwin", "linux"]
plugin = "ghostty"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "ghostty"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "ghostty"

# ── Config: cloned from dedicated repo at bootstrap ──

[[install]]
method = "git"
repo = "https://github.com/ca971/ghostty-config.git"
target = "~/.config/ghostty"
ref = "main"
platforms = ["darwin", "linux", "wsl", "bsd"]

[config]
dependencies = []
