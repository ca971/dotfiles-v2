# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/ghostty.toml
# @description Tool descriptor for Ghostty (GPU-accelerated terminal emulator)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "ghostty"
description = "GPU-accelerated terminal emulator — native, fast, feature-rich"
homepage = "https://ghostty.org"
category = "terminal"
version = "latest"
verify = "ghostty --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux"]
plugin = "ghostty"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "ghostty"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "ghostty"

[config]
symlinks = [{ src = "config/ghostty", dst = "~/.config/ghostty" }]
dependencies = []
