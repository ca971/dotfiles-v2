[meta]
name = "dua-cli"
description = "Disk usage analyzer with interactive mode"
homepage = "https://github.com/Byron/dua-cli"
category = "system"
version = "latest"
verify = "dua --version"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "dua-cli"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "dua-cli"

[config]
symlinks = []
dependencies = []
