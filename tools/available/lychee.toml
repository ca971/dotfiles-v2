# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/lychee.toml
# @description Tool descriptor for lychee (Fast link checker for markdown and HTML)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "lychee"
description = "Fast link checker for markdown and HTML"
homepage = "https://github.com/lycheeverse/lychee"
category = "dev"
version = "latest"
verify = "lychee --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "lychee"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "lychee"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "lychee"

[config]
symlinks = []
dependencies = []
