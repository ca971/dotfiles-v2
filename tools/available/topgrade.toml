# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/topgrade.toml
# @description Tool descriptor for topgrade (Upgrade all your tools with one command)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "topgrade"
description = "Upgrade all your tools with one command"
homepage = "https://github.com/topgrade-rs/topgrade"
category = "system"
version = "latest"
verify = "topgrade --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "topgrade"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "topgrade"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "topgrade"

[config]
symlinks = [{ src = "config/topgrade", dst = "~/.config/topgrade" }]
dependencies = []
