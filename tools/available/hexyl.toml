# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/hexyl.toml
# @description Tool descriptor for hexyl (Command-line hex viewer with colors)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "hexyl"
description = "Command-line hex viewer with colors"
homepage = "https://github.com/sharkdp/hexyl"
category = "dev"
version = "latest"
verify = "hexyl --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "hexyl"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "hexyl"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "hexyl"

[config]
symlinks = []
dependencies = []
