# @file tools/available/procs.toml
# @description Tool descriptor for procs (Modern replacement for ps written in Rust)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "procs"
description = "Modern replacement for ps written in Rust"
homepage = "https://github.com/dalance/procs"
category = "system"
version = "latest"
verify = "procs --version"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "procs"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "procs"

[config]
symlinks = []
dependencies = []
