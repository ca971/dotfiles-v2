[meta]
name = "doctl"
description = "DigitalOcean command-line interface"
homepage = "https://github.com/digitalocean/doctl"
category = "cloud"
version = "latest"
verify = "doctl version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "doctl"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "doctl"

[config]
symlinks = []
dependencies = []
