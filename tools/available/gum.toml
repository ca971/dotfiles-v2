[meta]
name = "gum"
description = "Tool for glamorous shell scripts"
homepage = "https://github.com/charmbracelet/gum"
category = "shell"
version = "latest"
verify = "gum --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "gum"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "gum"

[config]
symlinks = []
dependencies = []
