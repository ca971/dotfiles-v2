# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/difftastic.toml
# @description Tool descriptor for difftastic (Structural diff tool that understands syntax)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "difftastic"
description = "Structural diff tool that understands syntax"
homepage = "https://github.com/Wilfred/difftastic"
category = "dev"
version = "latest"
verify = "difft --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "difftastic"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "difftastic"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "difftastic"

[config]
symlinks = []
dependencies = []
