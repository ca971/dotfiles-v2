# @file tools/available/jj.toml
# @description Tool descriptor for jj (Git-compatible version control system)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "jj"
description = "Git-compatible version control system"
homepage = "https://github.com/jj-vcs/jj"
category = "dev"
version = "latest"
verify = "jj --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "jj"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "jj-cli"

[config]
symlinks = []
dependencies = []
