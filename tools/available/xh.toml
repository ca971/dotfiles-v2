# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/xh.toml
# @description Tool descriptor for xh (Friendly and fast HTTP request tool)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "xh"
description = "Friendly and fast HTTP request tool"
homepage = "https://github.com/ducaale/xh"
category = "net"
version = "latest"
verify = "xh --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "xh"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "xh"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "xh"

[config]
symlinks = []
dependencies = []
