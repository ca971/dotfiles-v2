[meta]
name = "chafa"
description = "Terminal image viewer using Unicode and ANSI"
homepage = "https://hpjansson.org/chafa"
category = "media"
version = "latest"
verify = "chafa --version"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "chafa"

[[install]]
method = "system"
platforms = ["linux.debian"]
package = "chafa"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "chafa"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "chafa"


[[install]]
method = "system"
platforms = ["bsd"]
package = "chafa"
[[install]]
method = "brew"
platforms = ["darwin"]
package = "chafa"

[config]
symlinks = []
dependencies = []
