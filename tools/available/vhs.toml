[meta]
name = "vhs"
description = "Terminal GIF/video recorder via script"
homepage = "https://github.com/charmbracelet/vhs"
category = "dev"
version = "latest"
verify = "vhs --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "vhs"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "vhs"

[config]
symlinks = []
dependencies = []
