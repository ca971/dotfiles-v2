[meta]
name = "sops"
description = "Simple and flexible encrypted file editor"
homepage = "https://github.com/getsops/sops"
category = "security"
version = "latest"
verify = "sops --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "sops"
