[meta]
name = "kustomize"
description = "Kubernetes configuration management without templates"
homepage = "https://kustomize.io"
category = "cloud"
version = "latest"
verify = "kustomize version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "kustomize"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "kustomize"

[config]
symlinks = []
dependencies = []
