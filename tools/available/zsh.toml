[meta]
name = "zsh"
description = "Z shell with advanced scripting features"
homepage = "https://www.zsh.org"
category = "shell"
version = "latest"
verify = "zsh --version"


[[install]]
method = "system"
platforms = ["linux.debian"]
package = "zsh"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "zsh"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "zsh"


[[install]]
method = "system"
platforms = ["bsd"]
package = "zsh"
[config]
symlinks = []
dependencies = []
