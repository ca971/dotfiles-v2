# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/zsh.toml
# @description Tool descriptor for zsh (Z shell)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "zsh"
description = "Z shell — powerful interactive shell with advanced features"
homepage = "https://www.zsh.org/"
category = "core"
version = "latest"
verify = "zsh --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "zsh"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "zsh"

[[install]]
method = "system"
platforms = ["linux.debian", "linux.ubuntu"]
package = "zsh"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "zsh"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "zsh"

[config]
symlinks = []
dependencies = []
