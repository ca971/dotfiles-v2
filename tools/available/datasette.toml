[meta]
name = "datasette"
description = "Tool for exploring and publishing data"
homepage = "https://datasette.io"
category = "data"
version = "latest"
verify = "datasette --version"

[[install]]
method = "uv"
platforms = ["darwin", "linux", "wsl", "bsd"]
package = "datasette"
version = "latest"

