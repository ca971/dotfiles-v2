# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/luajit.toml
# @description Tool descriptor for luajit (Just-in-time compiler for Lua)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "luajit"
description = "Just-in-time compiler for Lua"
homepage = "https://luajit.org"
category = "lang"
version = "latest"
verify = "luajit -v"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "luajit"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "luajit"

[[install]]
method = "system"
platforms = ["linux.debian"]
package = "luajit"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "luajit"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "luajit"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "luajit"

[config]
symlinks = []
dependencies = []
