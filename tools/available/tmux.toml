# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/tmux.toml
# @description Tool descriptor for tmux (Terminal multiplexer)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "tmux"
description = "Terminal multiplexer"
homepage = "https://github.com/tmux/tmux"
category = "core"
version = "latest"
verify = "tmux -V"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "tmux"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "tmux"

[[install]]
method = "system"
platforms = ["linux.debian"]
package = "tmux"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "tmux"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "tmux"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "tmux"

[config]
symlinks = [{ src = "config/tmux", dst = "~/.config/tmux" }]
dependencies = []
