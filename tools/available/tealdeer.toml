# @file tools/available/tealdeer.toml
# @description Tool descriptor for tealdeer (Fast tldr client written in Rust)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "tealdeer"
description = "Fast tldr client written in Rust"
homepage = "https://github.com/tealdeer-rs/tealdeer"
category = "shell"
version = "latest"
verify = "tldr --version"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "tealdeer"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "tealdeer"

[config]
symlinks = []
dependencies = []
