[meta]
name = "glow"
description = "Render markdown on the CLI with glamour"
homepage = "https://github.com/charmbracelet/glow"
category = "dev"
version = "latest"
verify = "glow --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "glow"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "glow"

[config]
symlinks = []
dependencies = []
