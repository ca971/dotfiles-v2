# @file tools/available/xsv.toml
# @description Tool descriptor for xsv (Fast CSV toolkit written in Rust)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "xsv"
description = "Fast CSV toolkit written in Rust"
homepage = "https://github.com/BurntSushi/xsv"
category = "data"
version = "latest"
verify = "xsv --version"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "xsv"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "xsv"

[config]
symlinks = []
dependencies = []
