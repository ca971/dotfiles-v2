[meta]
name = "fastfetch"
description = "Fast system information fetcher"
homepage = "https://github.com/fastfetch-cli/fastfetch"
category = "system"
version = "latest"
verify = "fastfetch --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "fastfetch"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "fastfetch"

[config]
symlinks = []
dependencies = []
