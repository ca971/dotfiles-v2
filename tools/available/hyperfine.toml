# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/hyperfine.toml
# @description Tool descriptor for hyperfine (Command-line benchmarking tool)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "hyperfine"
description = "Command-line benchmarking tool"
homepage = "https://github.com/sharkdp/hyperfine"
category = "dev"
version = "latest"
verify = "hyperfine --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "hyperfine"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "hyperfine"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "hyperfine"

[config]
symlinks = []
dependencies = []
