[meta]
name = "pwgen"
description = "Password generator"
homepage = "https://sourceforge.net/projects/pwgen"
category = "security"
version = "latest"
verify = "pwgen --version"


[[install]]
method = "system"
platforms = ["linux.debian"]
package = "pwgen"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "pwgen"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "pwgen"


[[install]]
method = "system"
platforms = ["bsd"]
package = "pwgen"
[[install]]
method = "brew"
platforms = ["darwin"]
package = "pwgen"

[config]
symlinks = []
dependencies = []
