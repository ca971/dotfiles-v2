# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/git-delta.toml
# @description Tool descriptor for git-delta (Syntax-highlighting pager for git diffs)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "git-delta"
description = "Syntax-highlighting pager for git diffs"
homepage = "https://github.com/dandavison/delta"
category = "dev"
version = "latest"
verify = "delta --version"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "git-delta"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "git-delta"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "git-delta"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "git-delta"

[config]
symlinks = [{ src = "config/delta", dst = "~/.config/delta" }]
dependencies = []
