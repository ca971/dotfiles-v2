[meta]
name = "sd"
description = "Intuitive find and replace CLI (sed alternative)"
homepage = "https://github.com/chmln/sd"
category = "core"
version = "latest"
verify = "sd --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "sd"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "sd"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "sd"

[config]
symlinks = []
dependencies = []
