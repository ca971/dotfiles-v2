# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/nushell.toml
# @description Tool descriptor for nushell (modern data-oriented shell)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "nushell"
description = "Modern shell with structured data, pipelines, and cross-platform support"
homepage = "https://www.nushell.sh/"
category = "shell"
version = "latest"
verify = "nu --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "aqua:nushell/nushell"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "nushell"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "nu"

[config]
symlinks = []
dependencies = []
