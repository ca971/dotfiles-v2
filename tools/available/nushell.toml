# @file tools/available/nushell.toml
# @description Tool descriptor for nushell (Modern structured shell)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "nushell"
description = "Modern structured shell"
homepage = "https://www.nushell.sh"
category = "shell"
version = "latest"
verify = "nu --version"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "nushell"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "nu"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "nushell"

[[install]]
method = "system"
platforms = ["bsd"]
package = "nushell"

[config]
symlinks = []
dependencies = []
