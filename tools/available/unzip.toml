[meta]
name = "unzip"
description = "Extraction utility for zip archives"
homepage = "https://infozip.sourceforge.net"
category = "core"
version = "latest"
verify = "unzip -v | head -1"


[[install]]
method = "system"
platforms = ["linux.debian"]
package = "unzip"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "unzip"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "unzip"


[[install]]
method = "system"
platforms = ["bsd"]
package = "unzip"
[config]
symlinks = []
dependencies = []
