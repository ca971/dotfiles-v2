# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/starship.toml
# @description Tool descriptor for starship (cross-shell prompt)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "starship"
description = "Minimal, blazing-fast, and customizable cross-shell prompt"
homepage = "https://starship.rs"
category = "core"
version = "latest"
verify = "starship --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "starship"
version = "latest"

[[install]]
method = "curl"
platforms = ["darwin", "linux", "wsl", "bsd"]
command = "curl -sS https://starship.rs/install.sh | sh -s -- --yes"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "starship"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "starship"

[config]
symlinks = [{ src = "config/starship", dst = "~/.config/starship" }]
dependencies = []
