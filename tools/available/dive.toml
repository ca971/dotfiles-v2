[meta]
name = "dive"
description = "Explore Docker image layers and reduce size"
homepage = "https://github.com/wagoodman/dive"
category = "containers"
version = "latest"
verify = "dive --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "dive"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "dive"

[config]
symlinks = []
dependencies = []
