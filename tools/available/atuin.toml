# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/atuin.toml
# @description Tool descriptor for atuin (Magical shell history with sync and search)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "atuin"
description = "Magical shell history with sync and search"
homepage = "https://github.com/atuinsh/atuin"
category = "shell"
version = "latest"
verify = "atuin --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "atuin"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "atuin"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "atuin"

[config]
symlinks = [{ src = "config/atuin", dst = "~/.config/atuin" }]
dependencies = []
