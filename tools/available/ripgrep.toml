# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/ripgrep.toml
# @description Tool descriptor for ripgrep (Ultra-fast regex search tool (rg))
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "ripgrep"
description = "Ultra-fast regex search tool (rg)"
homepage = "https://github.com/BurntSushi/ripgrep"
category = "core"
version = "latest"
verify = "rg --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "ripgrep"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "ripgrep"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "ripgrep"

[[install]]
method = "system"
platforms = ["linux.debian"]
package = "ripgrep"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "ripgrep"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "ripgrep"

[config]
symlinks = []
dependencies = []
