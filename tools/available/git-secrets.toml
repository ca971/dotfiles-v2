# @file tools/available/git-secrets.toml
# @description Tool descriptor for git-secrets (Prevents committing secrets to git repos)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "git-secrets"
description = "Prevents committing secrets to git repos"
homepage = "https://github.com/awslabs/git-secrets"
category = "security"
version = "latest"
verify = "git-secrets --version"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "git-secrets"


[[install]]
method = "system"
platforms = ["linux.debian"]
package = "git-secrets"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "git-secrets"
[config]
symlinks = []
dependencies = []
