[meta]
name = "ipython"
description = "Enhanced interactive Python shell"
homepage = "https://ipython.org"
category = "python"
version = "latest"
verify = "ipython --version"

[[install]]
method = "uv"
platforms = ["darwin", "linux", "wsl", "bsd"]
package = "ipython"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "ipython"

[config]
symlinks = []
dependencies = []
