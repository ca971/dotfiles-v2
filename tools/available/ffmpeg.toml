# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/ffmpeg.toml
# @description Tool descriptor for ffmpeg (Complete multimedia framework for audio/video)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "ffmpeg"
description = "Complete multimedia framework for audio/video"
homepage = "https://ffmpeg.org"
category = "media"
version = "latest"
verify = "ffmpeg -version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "ffmpeg"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "ffmpeg"

[[install]]
method = "system"
platforms = ["linux.debian"]
package = "ffmpeg"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "ffmpeg"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "ffmpeg"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "ffmpeg"

[config]
symlinks = []
dependencies = []
