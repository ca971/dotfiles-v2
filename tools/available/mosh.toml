[meta]
name = "mosh"
description = "Mobile shell for roaming and intermittent connectivity"
homepage = "https://mosh.org"
category = "net"
version = "latest"
verify = "mosh --version"


[[install]]
method = "system"
platforms = ["linux.debian"]
