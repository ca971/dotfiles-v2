[meta]
name = "ast-grep"
description = "Structural search and replace for code"
homepage = "https://github.com/ast-grep/ast-grep"
category = "dev"
version = "latest"
verify = "ast-grep --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "ast-grep"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "ast-grep"

[config]
symlinks = []
dependencies = []
