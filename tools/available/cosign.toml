[meta]
name = "cosign"
description = "Container image signing and verification"
homepage = "https://github.com/sigstore/cosign"
category = "security"
version = "latest"
verify = "cosign version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "cosign"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "cosign"

[config]
symlinks = []
dependencies = []
