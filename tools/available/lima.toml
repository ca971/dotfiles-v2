[meta]
name = "lima"
description = "Linux virtual machines on macOS"
homepage = "https://github.com/lima-vm/lima"
category = "containers"
version = "latest"
verify = "lima --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "lima"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "lima"

[config]
symlinks = []
dependencies = []
