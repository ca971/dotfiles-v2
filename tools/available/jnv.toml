[meta]
name = "jnv"
description = "Interactive JSON filter with jq"
homepage = "https://github.com/ynqa/jnv"
category = "data"
version = "latest"
verify = "jnv --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "jnv"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "jnv"

[config]
symlinks = []
dependencies = []
