[meta]
name = "miniserve"
description = "Simple HTTP file server from CLI"
homepage = "https://github.com/svenstaro/miniserve"
category = "net"
version = "latest"
verify = "miniserve --version"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "miniserve"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "miniserve"

[config]
symlinks = []
dependencies = []
