[meta]
name = "ollama"
description = "Run large language models locally"
homepage = "https://ollama.com"
category = "ai"
version = "latest"
verify = "ollama --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "ollama"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "ollama"

[config]
symlinks = []
dependencies = []
