[meta]
name = "aichat"
description = "All-in-one AI CLI chat and copilot"
homepage = "https://github.com/sigoden/aichat"
category = "ai"
version = "latest"
verify = "aichat --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "aichat"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "aichat"

[config]
symlinks = []
dependencies = []
