[meta]
name = "bandwhich"
description = "Terminal bandwidth utilization tool"
homepage = "https://github.com/imsnif/bandwhich"
category = "net"
version = "latest"
verify = "bandwhich --version"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "bandwhich"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "bandwhich"

[config]
symlinks = []
dependencies = []
