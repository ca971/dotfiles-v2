[meta]
name = "syft"
description = "Generate SBOMs for container images and filesystems"
homepage = "https://github.com/anchore/syft"
category = "security"
version = "latest"
verify = "syft version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "syft"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "syft"

[config]
symlinks = []
dependencies = []
