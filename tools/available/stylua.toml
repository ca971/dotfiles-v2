# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/stylua.toml
# @description Tool descriptor for stylua (Opinionated Lua code formatter)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "stylua"
description = "Opinionated Lua code formatter"
homepage = "https://github.com/JohnnyMorganz/StyLua"
category = "dev"
version = "latest"
verify = "stylua --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "stylua"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "stylua"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "stylua"

[config]
symlinks = []
dependencies = []
