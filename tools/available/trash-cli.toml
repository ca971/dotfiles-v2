[meta]
name = "trash-cli"
description = "Move files to trash from the command line"
homepage = "https://github.com/andreafrancia/trash-cli"
category = "core"
version = "latest"
verify = "trash --version"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "trash-cli"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "trash-cli"

[[install]]
method = "system"
platforms = ["linux.debian"]
package = "trash-cli"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "trash-cli"

[config]
symlinks = []
dependencies = []
