[meta]
name = "gallery-dl"
description = "Download image galleries from various sites"
homepage = "https://github.com/mikf/gallery-dl"
category = "media"
version = "latest"
verify = "gallery-dl --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "gallery-dl"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "gallery-dl"

[config]
symlinks = []
dependencies = []
