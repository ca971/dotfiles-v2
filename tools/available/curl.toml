[meta]
name = "curl"
description = "Command-line tool for transferring data with URLs"
homepage = "https://curl.se"
category = "core"
version = "latest"
verify = "curl --version"


[[install]]
method = "system"
platforms = ["linux.debian"]
package = "curl"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "curl"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "curl"


[[install]]
method = "system"
platforms = ["bsd"]
package = "curl"
[[install]]
method = "brew"
platforms = ["darwin"]
package = "curl"

[config]
symlinks = []
dependencies = []
