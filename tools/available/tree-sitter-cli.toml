[meta]
name = "tree-sitter-cli"
description = "CLI for tree-sitter parser generator"
homepage = "https://github.com/tree-sitter/tree-sitter"
category = "dev"
version = "latest"
verify = "tree-sitter --version"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "tree-sitter-cli"

[config]
symlinks = []
dependencies = []
