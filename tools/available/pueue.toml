[meta]
name = "pueue"
description = "Task queue and process manager"
homepage = "https://github.com/Nukesor/pueue"
category = "system"
version = "latest"
verify = "pueue --version"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "pueue"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "pueue"

[config]
symlinks = []
dependencies = []
