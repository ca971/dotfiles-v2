[meta]
name = "bore"
description = "Simple TCP tunnel (ngrok alternative)"
homepage = "https://github.com/ekzhang/bore"
category = "net"
version = "latest"
verify = "bore --version"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "bore-cli"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "bore-cli"

[config]
symlinks = []
dependencies = []
