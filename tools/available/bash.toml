[meta]
name = "bash"
description = "GNU Bourne Again SHell"
homepage = "https://www.gnu.org/software/bash"
category = "shell"
version = "latest"
verify = "bash --version"


[[install]]
method = "system"
platforms = ["linux.debian"]
package = "bash"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "bash"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "bash"


[[install]]
method = "system"
platforms = ["bsd"]
package = "bash"
[config]
symlinks = []
dependencies = []
