[meta]
name = "rsync"
description = "Fast and versatile file copying tool"
homepage = "https://rsync.samba.org"
category = "core"
version = "latest"
verify = "rsync --version"


[[install]]
method = "system"
platforms = ["linux.debian"]
package = "rsync"

[[install]]
method = "system"
