[meta]
name = "rustscan"
description = "Ultra-fast port scanner complementing nmap"
homepage = "https://github.com/RustScan/RustScan"
category = "security"
version = "latest"
verify = "rustscan --version"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "rustscan"

[config]
symlinks = []
dependencies = []
