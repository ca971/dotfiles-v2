[meta]
name = "fq"
description = "jq for binary formats"
homepage = "https://github.com/wader/fq"
category = "dev"
version = "latest"
verify = "fq --version"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "fq"


[[install]]
method = "system"
platforms = ["linux.debian"]
package = "fq"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "fq"

[[install]]
method = "system"
platforms = ["bsd"]
package = "fq"
[[install]]
method = "brew"
platforms = ["darwin"]
package = "fq"

[config]
symlinks = []
dependencies = []
