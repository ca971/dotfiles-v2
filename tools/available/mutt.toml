# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/mutt.toml
# @description Tool descriptor for mutt (Terminal-based email client)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "mutt"
description = "Terminal-based email client"
homepage = "http://www.mutt.org"
category = "net"
version = "latest"
verify = "mutt -v | head -1"


[[install]]
method = "system"
platforms = ["linux.debian"]
package = "mutt"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "mutt"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "mutt"


[[install]]
method = "system"
platforms = ["bsd"]
package = "mutt"
[[install]]
method = "brew"
platforms = ["darwin"]
package = "mutt"

[config]
symlinks = []
dependencies = []
