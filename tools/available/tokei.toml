[meta]
name = "tokei"
description = "Count lines of code quickly"
homepage = "https://github.com/XAMPPRocky/tokei"
category = "dev"
version = "latest"
verify = "tokei --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "tokei"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "tokei"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "tokei"

[config]
symlinks = []
dependencies = []
