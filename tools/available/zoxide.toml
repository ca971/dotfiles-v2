[meta]
name = "zoxide"
description = "Smarter cd command that learns your habits"
homepage = "https://github.com/ajeetdsouza/zoxide"
category = "shell"
version = "latest"
verify = "zoxide --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "zoxide"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "zoxide"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "zoxide"

[config]
symlinks = []
dependencies = []
