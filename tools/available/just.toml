# @file tools/available/just.toml
# @description Tool descriptor for just (Handy command runner inspired by make)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "just"
description = "Handy command runner inspired by make"
homepage = "https://github.com/casey/just"
category = "dev"
version = "latest"
verify = "just --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "just"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "just"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "just"

[config]
symlinks = []
dependencies = []
