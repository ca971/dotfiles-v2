[meta]
name = "solargraph"
description = "Ruby language server with IntelliSense"
homepage = "https://solargraph.org"
category = "ruby"
version = "latest"
verify = "solargraph --version"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "solargraph"


[[install]]
method = "system"
platforms = ["linux.debian", "bsd"]
package = "solargraph"
[[install]]
method = "brew"
platforms = ["darwin"]
package = "solargraph"

[config]
symlinks = []
dependencies = []
