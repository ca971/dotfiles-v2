# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/lsd.toml
# @description Tool descriptor for lsd (Modern ls replacement with icons and colors)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "lsd"
description = "Modern ls replacement with icons and colors"
homepage = "https://github.com/lsd-rs/lsd"
category = "core"
version = "latest"
verify = "lsd --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "lsd"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "lsd"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "lsd"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "lsd"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "lsd"

[config]
symlinks = []
dependencies = []
