[meta]
name = "sevenzip"
description = "Modern 7-Zip file archiver"
homepage = "https://7-zip.org"
category = "core"
version = "latest"
verify = "7zz --help | head -1"


[[install]]
method = "system"
platforms = ["linux.debian"]
package = "7zip"


[[install]]
method = "system"
platforms = ["bsd"]
package = "7-zip"
[[install]]
method = "brew"
platforms = ["darwin"]
package = "sevenzip"

[config]
symlinks = []
dependencies = []
