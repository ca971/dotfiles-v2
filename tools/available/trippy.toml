[meta]
name = "trippy"
description = "Network diagnostic tool combining traceroute and ping"
homepage = "https://github.com/fujiapple852/trippy"
category = "net"
version = "latest"
verify = "trip --version"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "trippy"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "trippy"

[config]
symlinks = []
dependencies = []
