[meta]
name = "usql"
description = "Universal SQL client for all databases"
homepage = "https://github.com/xo/usql"
category = "data"
version = "latest"
verify = "usql --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "usql"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "usql"

[config]
symlinks = []
dependencies = []
