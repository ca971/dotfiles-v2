[meta]
name = "duckdb"
description = "In-process analytical SQL database engine"
homepage = "https://duckdb.org"
category = "data"
version = "latest"
verify = "duckdb --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "duckdb"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "duckdb"

[config]
symlinks = []
dependencies = []
