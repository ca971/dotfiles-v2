[meta]
name = "gnu-sed"
description = "GNU stream editor"
homepage = "https://www.gnu.org/software/sed"
category = "core"
version = "latest"
verify = "sed --version"


[[install]]
method = "system"
platforms = ["linux.debian"]
package = "sed"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "sed"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "sed"


[[install]]
method = "system"
platforms = ["bsd"]
package = "gsed"
[config]
symlinks = []
dependencies = []
