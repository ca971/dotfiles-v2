[meta]
name = "silicon"
description = "Create beautiful code screenshots from terminal"
homepage = "https://github.com/Segber/silicon"
category = "dev"
version = "latest"
verify = "silicon --version"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
