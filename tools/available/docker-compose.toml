# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/docker-compose.toml
# @description Tool descriptor for docker-compose (Multi-container Docker application orchestration)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "docker-compose"
description = "Multi-container Docker application orchestration"
homepage = "https://github.com/docker/compose"
category = "containers"
version = "latest"
verify = "docker-compose version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "docker-compose"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "docker-compose"

[[install]]
method = "system"
platforms = ["linux.debian"]
package = "docker-compose"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "docker-compose"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "docker-compose"

[config]
symlinks = []
dependencies = []
