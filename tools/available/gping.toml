# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/gping.toml
# @description Tool descriptor for gping (Ping with a graph in the terminal)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "gping"
description = "Ping with a graph in the terminal"
homepage = "https://github.com/orf/gping"
category = "net"
version = "latest"
verify = "gping --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "gping"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "gping"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "gping"

[config]
symlinks = []
dependencies = []
