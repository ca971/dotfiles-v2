# @file tools/available/navi.toml
# @description Tool descriptor for navi (Interactive cheatsheet tool for the CLI)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "navi"
description = "Interactive cheatsheet tool for the CLI"
homepage = "https://github.com/denisidoro/navi"
category = "shell"
version = "latest"
verify = "navi --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "navi"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "navi"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "navi"

[config]
symlinks = []
dependencies = []
