[meta]
name = "fontconfig"
description = "Font configuration and customization library"
homepage = "https://www.freedesktop.org/wiki/Software/fontconfig"
category = "system"
version = "latest"
verify = "fc-list --version"


[[install]]
method = "system"
platforms = ["linux.debian"]
package = "fontconfig"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "fontconfig"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "fontconfig"


[[install]]
method = "system"
platforms = ["bsd"]
package = "fontconfig"
[[install]]
method = "brew"
platforms = ["darwin"]
package = "fontconfig"

[config]
symlinks = []
dependencies = []
