# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/onefetch.toml
# @description Tool descriptor for onefetch (Git repository summary in the terminal)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "onefetch"
description = "Git repository summary in the terminal"
homepage = "https://github.com/o2sh/onefetch"
category = "dev"
version = "latest"
verify = "onefetch --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "onefetch"
version = "latest"

[[install]]
method = "cargo"
platforms = ["darwin", "linux", "wsl", "bsd"]
crate = "onefetch"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "onefetch"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "onefetch"

[config]
symlinks = []
dependencies = []
