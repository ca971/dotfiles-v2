# ═══════════════════════════════════════════════════════════════════════════════
# @file tools/available/git.toml
# @description Tool descriptor for git (Distributed version control system)
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
name = "git"
description = "Distributed version control system"
homepage = "https://git-scm.com"
category = "core"
version = "latest"
verify = "git --version"


[[install]]
method = "system"
platforms = ["linux.debian"]
package = "git"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "git"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "git"


[[install]]
method = "system"
platforms = ["bsd"]
package = "git"
[[install]]
method = "brew"
platforms = ["darwin"]
package = "git"

[config]
symlinks = [
  { src = "config/git/.gitconfig", dst = "~/.gitconfig" },
  { src = "config/git/.gitattributes_global", dst = "~/.gitattributes_global" },
  { src = "config/git/.gitignore_global", dst = "~/.gitignore_global" },
  { src = "config/git/.gitmessage", dst = "~/.gitmessage" },
]
dependencies = []
