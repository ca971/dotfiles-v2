[meta]
name = "age"
description = "Simple, modern file encryption tool"
homepage = "https://github.com/FiloSottile/age"
category = "security"
version = "latest"
verify = "age --version"

[[install]]
method = "mise"
platforms = ["darwin", "linux", "wsl", "bsd"]
plugin = "age"
version = "latest"

[[install]]
method = "brew"
platforms = ["darwin"]
package = "age"

[[install]]
method = "system"
platforms = ["linux.debian"]
package = "age"

[[install]]
method = "system"
platforms = ["linux.arch"]
package = "age"

[[install]]
method = "system"
platforms = ["linux.fedora"]
package = "age"

[config]
symlinks = []
dependencies = []
