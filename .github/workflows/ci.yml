# ═══════════════════════════════════════════════════════════════════════════════
# @file .github/workflows/ci.yml
# @description Continuous Integration — lint, test, build on every push/PR
# @since 1.0.0
# @version 1.1.0
# ═══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═════════════════════════════════════════════════════════════════════════════
  # Lint — fast checks, no build required
  # ═════════════════════════════════════════════════════════════════════════════

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find . -name '*.sh' \
            -not -path './shells/*/generated/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 shellcheck --severity=warning --format=tty

  taplo:
    name: Taplo (TOML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: uncenter/setup-taplo@v2
        with:
          taplo-version: "0.9.3"
      - run: taplo format --check definitions/ tools/available/
      - run: taplo lint definitions/ tools/available/

  ruff:
    name: Ruff (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: generators/

  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: tests/e2e/Dockerfile.interactive
          failure-threshold: error

  # ═════════════════════════════════════════════════════════════════════════════
  # Test — requires build / runtime
  # ═════════════════════════════════════════════════════════════════════════════

  pytest:
    name: Pytest (generators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: cd generators && uv sync --extra dev
      - run: cd generators && uv run pytest tests/ -v

  bats:
    name: Bats (shell tests)
    runs-on: ubuntu-latest
    continue-on-error: true  # tests need full environment; non-blocking in CI
    steps:
      - uses: actions/checkout@v4
      - name: Install Bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats
      - name: Setup test fixtures
        run: |
          mkdir -p local
          echo '{"version":1,"tools":{},"nix_envs":{},"theme":"minimal"}'> local/state.json
          mkdir -p local/shell local/ssh/keys local/secrets local/config
          touch local/env.local local/gitconfig.local
          for shell in bash zsh fish; do
            mkdir -p "local/shell/${shell}"
            touch "local/shell/${shell}/local.${shell}rc"
          done
          mkdir -p local/shell/nushell
          touch local/shell/nushell/local.nu
      - name: Generate shell configs
        run: |
          pip install tomli pydantic jinja2
          cd generators && python -m src.cli generate --all
      - run: bats tests/unit/ --formatter tap
      - run: bats tests/integration/ --formatter tap

  docker-e2e:
    name: Docker E2E
    runs-on: ubuntu-latest
    needs: [shellcheck, taplo, ruff, pytest, bats]
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build -f tests/e2e/Dockerfile.interactive -t dotfiles-test .
      - name: Verify profiles
        run: |
          docker run --entrypoint "" --rm dotfiles-test python3 -c "
          import os
          toml = '/home/testuser/.dotfiles/definitions/profiles.toml'
          with open(toml) as f:
              c = f.read()
          profiles = [l.split('[profiles.')[1].rstrip(']') for l in c.split('\n') if l.startswith('[profiles.') and 'meta' not in l]
          assert len(profiles) == 7, f'Expected 7 profiles, got {len(profiles)}: {profiles}'
          print(f'OK: {len(profiles)} profiles found: {profiles}')
          "
      - name: Bootstrap dry-run
        run: |
          docker run --entrypoint "" --rm dotfiles-test \
            ./bootstrap.sh --minimal --dry-run 2>&1 | tee /dev/stderr | grep "Would install profile"
      - name: Locale check
        run: |
          docker run --entrypoint "" --rm dotfiles-test \
            bash -c 'locale 2>&1 >/dev/null && echo "OK" || echo "FAIL"'

  # ═════════════════════════════════════════════════════════════════════════════
  # Final gate
  # ═════════════════════════════════════════════════════════════════════════════

  all-checks:
    name: All Checks
    runs-on: ubuntu-latest
    needs: [shellcheck, taplo, ruff, hadolint, pytest, bats, docker-e2e]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "CI complete"
          echo "  shellcheck: ${{ needs.shellcheck.result }}"
          echo "  taplo:      ${{ needs.taplo.result }}"
          echo "  ruff:       ${{ needs.ruff.result }}"
          echo "  hadolint:   ${{ needs.hadolint.result }}"
          echo "  pytest:     ${{ needs.pytest.result }}"
          echo "  bats:       ${{ needs.bats.result }}"
          echo "  docker-e2e: ${{ needs.docker-e2e.result }}"
