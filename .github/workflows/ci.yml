# ═══════════════════════════════════════════════════════════════════════════════
# @file .github/workflows/ci.yml
# @description Continuous Integration — lint, test, build on every push/PR
# @since 1.0.0
# @version 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═════════════════════════════════════════════════════════════════════════════
  # Lint — fast checks, no build required
  # ═════════════════════════════════════════════════════════════════════════════

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./
          format: tty
          severity: warning
          additional_files: 'bootstrap.sh install.sh'

  taplo:
    name: Taplo (TOML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: uncenter/setup-taplo@v2
        with:
          taplo-version: "0.9.3"
      - run: taplo format --check .
      - run: taplo lint .

  ruff:
    name: Ruff (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: generators/

  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3
        with:
          dockerfile: tests/e2e/Dockerfile.interactive
          failure-threshold: warning

  # ═════════════════════════════════════════════════════════════════════════════
  # Test — requires build / runtime
  # ═════════════════════════════════════════════════════════════════════════════

  pytest:
    name: Pytest (generators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: cd generators && uv sync
      - run: cd generators && uv run pytest tests/ -v

  bats:
    name: Bats (shell tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: brokenpip3/setup-bats-libs@v1
        with:
          support-install: true
          assert-install: true
          detik-install: false
          file-install: false
      - run: bats tests/unit/ --formatter tap
      - run: bats tests/integration/ --formatter tap

  docker-e2e:
    name: Docker E2E
    runs-on: ubuntu-latest
    needs: [shellcheck, taplo, ruff, pytest, bats]
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build -f tests/e2e/Dockerfile.interactive -t dotfiles-test .
      - name: Verify profiles
        run: |
          docker run --entrypoint "" --rm dotfiles-test python3 -c "
          import os
          toml = '/home/testuser/.dotfiles/definitions/profiles.toml'
          # Quick sanity: file exists and has all 6 profiles
          with open(toml) as f:
              c = f.read()
          profiles = [l.split('[profiles.')[1].rstrip(']') for l in c.split('\n') if l.startswith('[profiles.') and 'meta' not in l]
          assert len(profiles) == 6, f'Expected 6 profiles, got {len(profiles)}'
          print(f'OK: {len(profiles)} profiles found: {profiles}')
          "
      - name: Bootstrap dry-run
        run: >
          docker run --entrypoint "" --rm dotfiles-test
          ./bootstrap.sh --minimal --dry-run 2>&1 |
          grep "Would install profile"
      - name: Locale check
        run: >
          docker run --entrypoint "" --rm dotfiles-test
          bash -c 'locale 2>&1 >/dev/null &&
          echo "OK" || echo "FAIL"'

  # ═════════════════════════════════════════════════════════════════════════════
  # Final gate
  # ═════════════════════════════════════════════════════════════════════════════

  all-checks:
    name: All Checks
    runs-on: ubuntu-latest
    needs: [shellcheck, taplo, ruff, hadolint, pytest, bats, docker-e2e]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "CI complete"
          echo "  shellcheck: ${{ needs.shellcheck.result }}"
          echo "  taplo:      ${{ needs.taplo.result }}"
          echo "  ruff:       ${{ needs.ruff.result }}"
          echo "  hadolint:   ${{ needs.hadolint.result }}"
          echo "  pytest:     ${{ needs.pytest.result }}"
          echo "  bats:       ${{ needs.bats.result }}"
          echo "  docker-e2e: ${{ needs.docker-e2e.result }}"
