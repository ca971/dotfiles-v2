# ═══════════════════════════════════════════════════════════════════════════════
# @file definitions/profiles.toml
# @description Machine profiles — tool sets grouped by usage pattern
# @since 1.0.0
# @version 1.0.0
# @see lib/hotload/engine.sh
#
# Each profile defines a curated list of tools for a specific machine type.
# Profiles can extend other profiles to inherit their tool sets.
# The engine resolves the full chain and installs all required tools.
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
description = "Machine profiles — tool sets by usage pattern"

# ───────────────────────────────────────────────────────────────────────────────
# Minimal — Essential CLI tools for any machine (installed via mise)
# ───────────────────────────────────────────────────────────────────────────────

[profiles.minimal]
description = "Essential CLI tools via mise"
tools = [
  "starship",
  "eza",
  "neovim",
  "atuin",
  "fzf",
  "duf",
  "dfc",
  "btop",
