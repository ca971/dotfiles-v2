# ═══════════════════════════════════════════════════════════════════════════════
# @file definitions/env.toml
# @description Single Source of Truth for environment variables
# @since 1.0.0
# @version 1.0.0
# @see docs/SSOT.md
#
# Fields:
#   value       - The value to set
#   description - Human-readable description
#   platforms   - [optional] Platform restriction (default: all)
#   condition   - [optional] Shell condition to check before setting
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Core dotfiles
# ───────────────────────────────────────────────────────────────────────────────

[env.dotfiles]
DOTFILES_DIR = { value = "$HOME/.dotfiles", description = "Dotfiles root directory" }

# ───────────────────────────────────────────────────────────────────────────────
# XDG Base Directories
# ───────────────────────────────────────────────────────────────────────────────

[env.xdg]
XDG_CONFIG_HOME = { value = "$HOME/.config", description = "User configuration directory" }
XDG_DATA_HOME = { value = "$HOME/.local/share", description = "User data directory" }
XDG_STATE_HOME = { value = "$HOME/.local/state", description = "User state directory" }
XDG_CACHE_HOME = { value = "$HOME/.cache", description = "User cache directory" }
XDG_BIN_HOME = { value = "$HOME/.local/bin", description = "User binary directory" }

# ───────────────────────────────────────────────────────────────────────────────
# Editor & Pager
# ───────────────────────────────────────────────────────────────────────────────

[env.editor]
EDITOR = { value = "nvim", description = "Default text editor" }
VISUAL = { value = "nvim", description = "Default visual editor" }
PAGER = { value = "less", description = "Default pager" }
MANPAGER = { value = "nvim +Man!", description = "Man page viewer via neovim" }
LESS = { value = "-RFX --mouse", description = "Less options (raw color, quit-if-one-screen, no-init)" }

# ───────────────────────────────────────────────────────────────────────────────
# Locale
# ───────────────────────────────────────────────────────────────────────────────

[env.locale]
LANG = { value = "en_US.UTF-8", description = "Default locale" }
LC_ALL = { value = "en_US.UTF-8", description = "Override all locale categories" }

# ───────────────────────────────────────────────────────────────────────────────
# Colors & Theme
# ───────────────────────────────────────────────────────────────────────────────

[env.colors]
COLORTERM = { value = "truecolor", description = "Enable truecolor support" }
CLICOLOR = { value = "1", description = "Enable CLI colors" }
LS_COLORS = { value = "$(vivid generate catppuccin-mocha)", description = "LS_COLORS via vivid", condition = "command -v vivid" }

# ───────────────────────────────────────────────────────────────────────────────
# Tool-specific
# ───────────────────────────────────────────────────────────────────────────────

[env.tools]
BAT_THEME = { value = "Catppuccin Mocha", description = "Bat color theme" }
FZF_DEFAULT_COMMAND = { value = "fd --type f --hidden --follow --exclude .git", description = "FZF default file finder" }
FZF_DEFAULT_OPTS = { value = "--height 60% --layout=reverse --border --info=inline", description = "FZF default options" }
RIPGREP_CONFIG_PATH = { value = "$XDG_CONFIG_HOME/ripgrep/config", description = "Ripgrep config location" }
STARSHIP_CONFIG = { value = "$XDG_CONFIG_HOME/starship/base.toml", description = "Starship config path" }
MISE_USE_TOML = { value = "1", description = "Mise uses TOML config format" }

# ───────────────────────────────────────────────────────────────────────────────
# Development
# ───────────────────────────────────────────────────────────────────────────────

[env.dev]
GOPATH = { value = "$HOME/go", description = "Go workspace path" }
CARGO_HOME = { value = "$HOME/.cargo", description = "Cargo home directory" }
RUSTUP_HOME = { value = "$HOME/.rustup", description = "Rustup home directory" }
UV_CACHE_DIR = { value = "$XDG_CACHE_HOME/uv", description = "UV cache directory" }
PYTHONDONTWRITEBYTECODE = { value = "1", description = "Prevent Python .pyc files" }
NODE_OPTIONS = { value = "--max-old-space-size=8192", description = "Node.js memory limit" }

# ───────────────────────────────────────────────────────────────────────────────
# Security
# ───────────────────────────────────────────────────────────────────────────────

[env.security]
GPG_TTY = { value = "$(tty)", description = "GPG TTY for passphrase entry" }
SSH_AUTH_SOCK = { value = "$HOME/.ssh/agent.sock", description = "SSH agent socket", platforms = ["linux", "wsl"] }

# ───────────────────────────────────────────────────────────────────────────────
# macOS-specific
# ───────────────────────────────────────────────────────────────────────────────

[env.darwin]
HOMEBREW_NO_ANALYTICS = { value = "1", description = "Disable Homebrew analytics", platforms = ["darwin"] }
HOMEBREW_NO_AUTO_UPDATE = { value = "1", description = "Disable Homebrew auto-update", platforms = ["darwin"] }
HOMEBREW_CLEANUP_MAX_AGE_DAYS = { value = "30", description = "Homebrew cleanup age", platforms = ["darwin"] }
BASH_SILENCE_DEPRECATION_WARNING = { value = "1", description = "Silence macOS bash deprecation", platforms = ["darwin"] }
